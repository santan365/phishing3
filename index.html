<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#3d9eff" />
  <meta name="description" content="Test your ability to spot phishing, smishing and vishing attacks." />
  <title>Phishing Awareness Trainer</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
</head>
<body>
  <header class="app-header">
    <h1>Phishing Awareness Trainer</h1>
  </header>
  <main id="app" class="container"></main>
  <footer class="app-footer">CSEC3100 &middot; MVP v0.4 &middot; De Montfort University</footer>
  <!-- Chart.js loaded from CDN for the performance dashboard -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="app.js"></script>
  <script>
    // Register the service worker for PWA offline support
    // Only runs in production (GitHub Pages) not on localhost
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/phishing-trainer/service-worker.js')
          .then(reg => console.log('Service worker registered:', reg.scope))
          .catch(err => console.log('Service worker failed:', err));
      });
    }
  </script>
</body>
</html>
